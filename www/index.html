<style>

</style>

function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1800)}
function streak(){
  const days=new Set(Object.values(S.done)); let n=0; const d=new Date();
  if(!days.has(d.toISOString().slice(0,10))) d.setDate(d.getDate()-1);
  while(days.has(d.toISOString().slice(0,10))){n++; d.setDate(d.getDate()-1);}
  return n;
}

let stack=[];
function go(view,arg,push=true){
  if(push && current) stack.push(current);
  current={view,arg};
  render();
}
let current=null;
$("#back").onclick=()=>{ current=stack.pop()||{view:"home"}; render(); };
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{stack=[];current=null;go(b.dataset.tab)});
document.addEventListener("backbutton",()=>{ if(stack.length) $("#back").click(); },false);

function setHeader(title){
  $("#title").textContent=title;
  $("#back").style.display=stack.length?"block":"none";
  const tab = {home:"home",program:"program",day:"program",topics:"topics",topic:"topics",calm:"calm",journal:"journal",settings:"home"}[current.view];
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
  window.scrollTo(0,0);
}

/* ================= VIEWS ================= */
const V={};

V.home=()=>{
  const n=doneCount(), nd=nextDay(), d=DAYS[nd], tp=topic(d.t);
  const q=QUOTES[new Date().getDate()%QUOTES.length];
  const m=S.mood[today()];
  setHeader("ParentPro");
  app.innerHTML=`
  <div class="card hero"><img src="keluarga.jpg" alt="">
    <div class="in">
      <h2 style="margin-top:0">${S.name?"Assalamualaikum, "+esc(S.name)+" 👋":"Program Bimbingan Hidup 30 Hari"}</h2>
      <span class="tag">Ibu Bapa Tenang, Anak-Anak Yakin</span>
    </div></div>

  <div class="card">
    <div class="stats">
      <div class="stat"><b>${n}/30</b><span>Hari selesai</span></div>
      <div class="stat"><b>${streak()}🔥</b><span>Hari berturut</span></div>
      <div class="stat"><b>${Math.round(n/30*100)}%</b><span>Kemajuan</span></div>
    </div>
    <div class="bar"><i style="width:${n/30*100}%"></i></div>
  </div>

  <div class="card">
    <div class="muted">${n===30?"🎉 Program selesai! Ulang kaji bila-bila masa":"Pelajaran seterusnya"}</div>
    <h2>Hari ${nd+1}: ${d.title}</h2>
    <div class="muted">${tp.ic} ${tp.name}</div>
    <button class="btn" onclick="go('day',${nd})">Mula Hari ${nd+1} ›</button>
  </div>

  <div class="card">
    <b>Bagaimana perasaan anda hari ini?</b>
    <div class="moods">${["😄","🙂","😐","😟","😫"].map(e=>`<button class="${m===e?"on":""}" onclick="setMood('${e}')">${e}</button>`).join("")}</div>
    ${m==="😟"||m==="😫"?`<button class="btn alt" onclick="go('calm')">🌿 Cuba latihan pernafasan 1 minit</button>`:""}
  </div>

  <div class="card"><p class="quote">${q}</p></div>
  <button class="btn ghost" onclick="go('settings')">⚙️ Tetapan</button>
  <div class="footer">Fun Learning with Teacher Sha<br>B.Ed, 13 Tahun Pengalaman Mengajar, Jurulatih TTT Bertauliah (8181)</div>`;
};
window.setMood=e=>{S.mood[today()]=e;save();render();};

V.program=()=>{
  const nd=nextDay();
  setHeader("Program 30 Hari");
  app.innerHTML=`
  <div class="card"><b>${doneCount()} daripada 30 hari selesai</b>
    <div class="bar"><i style="width:${doneCount()/30*100}%"></i></div>
    <div class="muted">Tekan nombor hari untuk membuka pelajaran.</div></div>
  <div class="card"><div class="days">
   ${DAYS.map((d,i)=>`<button class="d ${S.done[i]?"ok":""} ${i===nd&&!S.done[i]?"today":""}" onclick="go('day',${i})">${S.done[i]?"✓":i+1}</button>`).join("")}
  </div></div>
  <div class="card">${DAYS.map((d,i)=>{const t=topic(d.t);return `
    <div class="row" onclick="go('day',${i})">
      <div class="ic" style="background:${t.c}">${t.ic}</div>
      <div class="t"><b>Hari ${i+1}: ${d.title}</b><span class="muted">${t.name}</span></div>
      <span class="chk">${S.done[i]?"✅":"›"}</span></div>`}).join("")}</div>`;
};

V.day=(i)=>{
  const d=DAYS[i], t=topic(d.t), done=!!S.done[i];
  setHeader("Hari "+(i+1));
  app.innerHTML=`
  <div class="card">
    <div class="row" style="border:0;padding:0"><div class="ic" style="background:${t.c}">${t.ic}</div>
      <div class="t"><span class="muted">${t.name}</span><b style="font-size:18px">${d.title}</b></div></div>
    <h3>📖 Pelajaran</h3><p>${d.lesson}</p>
    <div class="box task"><b>✍️ Tugasan Hari Ini</b><br>${d.task}</div>
    <div class="box ref"><b>💭 Refleksi</b><br>${d.ref}</div>
    <textarea id="note" placeholder="Tulis catatan refleksi anda di sini...">${esc(S.notes[i])}</textarea>
    <button class="btn alt" onclick="saveNote(${i})">💾 Simpan Catatan</button>
    <button class="btn ${done?"done":""}" onclick="toggleDone(${i})">${done?"✅ Selesai (tekan untuk batal)":"Tandakan Selesai"}</button>
  </div>
  <div style="display:flex;gap:10px">
    ${i>0?`<button class="btn ghost" onclick="go('day',${i-1},false)">‹ Hari ${i}</button>`:""}
    ${i<29?`<button class="btn ghost" onclick="go('day',${i+1},false)">Hari ${i+2} ›</button>`:""}
  </div>`;
};
window.saveNote=i=>{S.notes[i]=$("#note").value;save();toast("Catatan disimpan 💾");};
window.toggleDone=i=>{
  S.notes[i]=$("#note").value;
  if(S.done[i]) delete S.done[i]; else { S.done[i]=today(); toast(doneCount()===29?"🎉 Tahniah! Program 30 hari selesai!":"Syabas! Hari "+(i+1)+" selesai 🌟"); }
  save(); render();
};

V.topics=()=>{
  setHeader("12 Topik Utama");
  app.innerHTML=`<div class="grid">${TOPICS.map(t=>`
    <button class="topic" onclick="go('topic',${t.id})"><div class="ic" style="background:${t.c}">${t.ic}</div>${t.name}</button>`).join("")}</div>`;
};

V.topic=(id)=>{
  const t=topic(id); const list=DAYS.map((d,i)=>({d,i})).filter(x=>x.d.t===id);
  const k=list.filter(x=>S.done[x.i]).length;
  setHeader(t.name);
  app.innerHTML=`
  <div class="card" style="text-align:center">
    <div class="ic" style="width:80px;height:80px;border-radius:50%;background:${t.c};margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:42px">${t.ic}</div>
    <h2>${t.name}</h2><p class="muted">${t.desc}</p>
    <div class="bar"><i style="width:${k/list.length*100}%"></i></div><span class="muted">${k}/${list.length} pelajaran selesai</span>
  </div>
  <div class="card">${list.map(x=>`
    <div class="row" onclick="go('day',${x.i})"><div class="t"><b>Hari ${x.i+1}: ${x.d.title}</b></div><span class="chk">${S.done[x.i]?"✅":"›"}</span></div>`).join("")}</div>`;
};

let breathTimer=null;
V.calm=()=>{
  setHeader("Sudut Tenang");
  app.innerHTML=`
  <div class="card" style="text-align:center">
    <h2>Pernafasan Tenang</h2>
    <p class="muted">Gunakan bila rasa marah atau tertekan. Ikut bulatan: tarik nafas ketika membesar, hembus ketika mengecil.</p>
    <div class="breath" id="br">Sedia?</div>
    <button class="btn" id="bbtn" onclick="toggleBreath()">▶ Mula 1 Minit</button>
  </div>
  <div class="card">
    <h3>🛑 Teknik BERHENTI</h3>
    <p><b>B</b>erhenti seketika — jangan terus bertindak.<br>
       <b>T</b>arik nafas dalam 3 kali.<br>
       <b>P</b>erhatikan perasaan anda dan keperluan anak.<br>
       <b>P</b>ilih respons yang tenang.</p>
    <h3>💬 Ayat Penenang Diri</h3>
    <p class="quote">"Anak saya bukan menyusahkan saya, dia sedang susah."</p>
    <p class="quote">"Saya boleh tenang. Saya ialah contoh untuk anak saya."</p>
  </div>`;
};
window.toggleBreath=()=>{
  const br=$("#br"), b=$("#bbtn");
  if(breathTimer){clearInterval(breathTimer);breathTimer=null;br.classList.remove("big");br.textContent="Sedia?";b.textContent="▶ Mula 1 Minit";return;}
  let t=0; b.textContent="⏹ Berhenti";
  const step=()=>{ if(!document.body.contains(br)){clearInterval(breathTimer);breathTimer=null;return;}
    if(t>=60){clearInterval(breathTimer);breathTimer=null;br.classList.remove("big");br.textContent="Syabas 🌿";b.textContent="▶ Ulang";return;}
    const inhale=(t/4)%2===0; br.classList.toggle("big",inhale); br.textContent=inhale?"Tarik...":"Hembus..."; t+=4; };
  step(); breathTimer=setInterval(step,4000);
};

V.journal=()=>{
  const items=Object.keys(S.notes).filter(k=>S.notes[k]&&S.notes[k].trim()).map(Number).sort((a,b)=>a-b);
  setHeader("Jurnal Saya");
  app.innerHTML = items.length? items.map(i=>`
    <div class="card" onclick="go('day',${i})"><span class="muted">Hari ${i+1} · ${topic(DAYS[i].t).name}</span>
      <b style="display:block">${DAYS[i].title}</b><p style="white-space:pre-wrap;margin:6px 0 0">${esc(S.notes[i])}</p></div>`).join("")
    : `<div class="card" style="text-align:center"><div style="font-size:48px">📔</div><p>Belum ada catatan.<br><span class="muted">Catatan refleksi daripada setiap hari akan muncul di sini.</span></p>
       <button class="btn" onclick="go('day',${nextDay()})">Mula Pelajaran</button></div>`;
};

V.settings=()=>{
  setHeader("Tetapan");
  app.innerHTML=`
  <div class="card"><b>Nama anda</b>
    <input id="nm" value="${esc(S.name)}" placeholder="Contoh: Puan Aishah">
    <button class="btn" onclick="S.name=$('#nm').value.trim();save();toast('Disimpan')">Simpan</button></div>
  <div class="card"><b>Mula semula program</b><p class="muted">Padam semua kemajuan dan catatan.</p>
    <button class="btn ghost" onclick="resetAll()">🗑 Set Semula</button></div>
  <div class="footer">ParentPro by Teacher Sha v1.0<br>Fun Learning with Teacher Sha</div>`;
};
window.resetAll=()=>{ if(confirm("Padam semua kemajuan dan catatan?")){S={done:{},notes:{},mood:{},name:S.name};save();toast("Program diset semula");go("home");} };

function render(){ if(!current) current={view:"home"}; V[current.view](current.arg); }
window.go=go;
render();
</script>
</body>
</html>
