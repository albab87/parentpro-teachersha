name: Bina APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Sediakan projek Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "ParentPro by Teacher Sha" com.teachersha.parentpro --web-dir www
          npx cap add android
          npx cap sync android

      - name: Pasang ikon app
        run: |
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for n in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp icons/$n.png $RES/mipmap-$n/ic_launcher.png
            cp icons/$n.png $RES/mipmap-$n/ic_launcher_round.png
            cp icons/$n.png $RES/mipmap-$n/ic_launcher_foreground.png
          done

      - name: Bina APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Namakan semula APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ParentPro.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ParentPro-APK
          path: ParentPro.apk

      - name: Terbit sebagai Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ParentPro v1.0.${{ github.run_number }}
          body: "Muat turun ParentPro.apk di bawah dan install di telefon Android."
          files: ParentPro.apk
          make_latest: true
